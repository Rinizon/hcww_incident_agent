version: "3.9"

services:
  incident-agent:
    build: .
    container_name: hcww-incident-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HCWW_AGENT_HOST: 0.0.0.0
      HCWW_AGENT_PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
